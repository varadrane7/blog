server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Add Link headers to the homepage
        location = / {
            root /usr/share/nginx/html;
            add_header Link '</.well-known/api-catalog>; rel="api-catalog", </about>; rel="service-doc"' always;
            
            # Content negotiation for homepage
            if ($http_accept ~* "text/markdown") {
                rewrite ^(.*)$ /index.md last;
            }
            try_files /index.html =404;
        }

        # Content negotiation for other pages
        if ($http_accept ~* "text/markdown") {
            rewrite ^(.*?)/?$ $1/index.md last;
        }

        try_files $uri $uri/index.html $uri.html =404;
    }

    # Custom content-type for well-known and special files
    location = /.well-known/api-catalog {
        root /usr/share/nginx/html;
        default_type application/linkset+json;
        add_header Content-Type "application/linkset+json; charset=utf-8" always;
    }

    location = /.well-known/openid-configuration {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
    }

    location = /.well-known/oauth-authorization-server {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
    }

    location = /.well-known/oauth-protected-resource {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
    }

    location = /.well-known/mcp/server-card.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
    }

    location = /.well-known/agent-skills/index.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
    }

    # Make sure .md files are served with content-type text/markdown
    location ~* \.md$ {
        root /usr/share/nginx/html;
        default_type text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header x-markdown-tokens 1500 always;
    }
}
